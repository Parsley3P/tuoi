<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESL Practice App</title>
<style>
    :root {
        --primary: #3498db;
        --primary-hover: #2980b9;
        --correct: #2ecc71;
        --correct-bg: #e8f8f5;
        --wrong: #e74c3c;
        --wrong-bg: #fdedec;
        --text: #2c3e50;
        --bg: #f4f7f6;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }
    #app {
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        max-width: 650px;
        width: 100%;
        text-align: center;
    }
    #progress {
        font-size: 0.9em;
        color: #7f8c8d;
        margin-bottom: 20px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .question-text {
        font-size: 1.25em;
        margin-bottom: 25px;
        text-align: left;
        line-height: 1.5;
    }
    .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: left;
    }
    label.option-label {
        padding: 12px 15px;
        border: 2px solid #ecf0f1;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        font-size: 1.05em;
    }
    label.option-label:hover {
        border-color: var(--primary);
        background-color: #fbfcff;
    }
    input[type="radio"] {
        margin-right: 12px;
        transform: scale(1.2);
    }
    input[type="text"] {
        width: 100%;
        padding: 12px;
        font-size: 1.1em;
        border: 2px solid #bdc3c7;
        border-radius: 8px;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.2s;
    }
    input[type="text"]:focus {
        border-color: var(--primary);
    }
    .btn {
        margin-top: 20px;
        padding: 12px 25px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1.1em;
        width: 100%;
        transition: background 0.2s;
    }
    .btn:hover {
        background-color: var(--primary-hover);
    }
    .correct-element {
        border-color: var(--correct) !important;
        background-color: var(--correct-bg) !important;
        color: #27ae60;
    }
    .wrong-element {
        border-color: var(--wrong) !important;
        background-color: var(--wrong-bg) !important;
        color: #c0392b;
    }
    #explanation {
        margin-top: 25px;
        padding: 15px 20px;
        border-radius: 8px;
        display: none;
        font-size: 1em;
        text-align: left;
        line-height: 1.5;
    }
    .exp-correct { background-color: var(--correct-bg); color: #27ae60; border-left: 5px solid var(--correct); }
    .exp-wrong { background-color: var(--wrong-bg); color: #c0392b; border-left: 5px solid var(--wrong); }
</style>
</head>
<body>

<div id="app">
    <div id="progress">Đang tải...</div>
    <div id="question-container"></div>
    <div id="explanation"></div>
    <button id="next-btn" class="btn" style="display: none;">Tiếp theo (Enter)</button>
</div>

    {q: "If I tell you a ________, you mustn't tell it to anyone else.", o: ["secret", "story", "message"], a: 0, e: "Secret: Bí mật."},
    {q: "Sam was ________ when he fell off the horse.", o: ["annoying", "embarrassing", "embarrassed"], a: 2, e: "Embarrassed (adj-ed) dùng để chỉ cảm giác xấu hổ của con người."},
    {q: "Max is very ________; I hope he can afford such expensive gifts.", o: ["reliable", "generous", "confident"], a: 1, e: "Generous: Hào phóng (mua quà đắt tiền)."},

    {q: "We had ________ our neighbours about the party but they still complained about the noise.", o: ["invited", "warned", "apologised"], a: 1, e: "Warned: Đã cảnh báo/báo trước."},

    {q: "Over 200 ________ entered the race.", o: ["competitors", "competitive", "competitions", "competes"], a: 0, e: "Cần N chỉ người số nhiều. Competitors: Người thi đấu."},

    {q: "I don't know much about ________ computers, so I asked the assistant for ________ advice.", o: ["a lot", "many", "a few", "a little"], a: 3, e: "Advice là danh từ không đếm được -> a little advice."},
    {q: "In my experience, ________ are very friendly.", o: ["Chinese", "a Chinese", "the Chinese", "this Chinese"], a: 2, e: "The + nationality (The Chinese) = Người dân nước đó."},
    {q: "Dad has to go to ________ early tomorrow to meet an important customer.", o: ["work", "the work", "a work", "that work"], a: 0, e: "Go to work: Đi làm (cụm từ cố định không mạo từ)."},
    {q: "Which is more important - money or ________?", o: ["environment", "the environment", "an environment", "one environment"], a: 1, e: "The environment: Môi trường (danh từ duy nhất)."},
    {q: "Apparently, it's the largest computer store in ________.", o: ["an Europe", "a Europe", "the Europe", "Europe"], a: 3, e: "Tên châu lục (Europe) không có mạo từ."},
    {q: "Let me just add ________ what I'm buying to see if I've got enough money.", o: ["on", "down", "over", "up"], a: 3, e: "Add up: Cộng tổng lại."},
    {q: "Bob ________ a lot of money in his brother's business and made a profit.", o: ["spent", "invested", "saved", "owed"], a: 1, e: "Invest in: Đầu tư vào."},
    {q: "I'm saving all my pocket money ________ to buy a new PlayStation.", o: ["out", "down", "up", "away"], a: 2, e: "Save up: Tiết kiệm tiền."},
    {q: "The old man took the book ________ from the shelf and looked at the price.", o: ["up", "down", "out", "in"], a: 1, e: "Take down: Lấy xuống (từ trên kệ)."},
    {q: "I couldn't sell my old magazines, so I gave them ________.", o: ["over", "off", "up", "away"], a: 3, e: "Give away: Cho tặng (không lấy tiền)."},
    {q: "I gave the waiter a €50 note and waited for my ________.", o: ["change", "supply", "cash", "cost"], a: 0, e: "Change: Tiền thừa/Tiền thối lại."},
    {q: "Home Lovers have got lots of ________ in their sale this year.", o: ["debts", "fortunes", "bargains", "fees"], a: 2, e: "Bargains: Món hàng hời (trong đợt giảm giá)."},
    {q: "I usually spend any money I have ________ sweets and video games.", o: ["with", "to", "on", "at"], a: 2, e: "Spend money ON something: Tiêu tiền vào việc gì."},

    // Word Formations
    {q: "Why do all ________________ (SCIENCE) have untidy hair?", a: ["scientists"], e: "Danh từ chỉ người số nhiều (Các nhà khoa học)."},
    {q: "Pour the ________________ (BOIL) water over the tea bag and leave for a few minutes.", a: ["boiling"], e: "Boiling water: Nước sôi (hiện tại phân từ dùng làm tính từ)."},
    {q: "Make sure your ________________ (MEASURE) are accurate.", a: ["measurements"], e: "Danh từ số nhiều (Các phép đo lường)."},
    {q: "My brother is studying ________________ (CHEMIST) at university.", a: ["chemistry"], e: "Hóa học (ngành học)."},

    // Rel Clauses & Modals MCQs
    {q: "Did someone help Alison or did she do all the calculations ________?", o: ["her", "hers", "herself"], a: 2, e: "Herself: Tự cô ấy làm (Đại từ phản thân)."},
    {q: "That's not your calculator. It's ________.", o: ["me", "mine", "my"], a: 1, e: "Mine = My calculator (Đại từ sở hữu)."},
    {q: "Einstein is the person ________ showed that time can speed up and slow down.", o: ["which", "who", "whose"], a: 1, e: "Who thay thế cho người (the person)."},
    {q: "Do you know ________ idea it was? Was it Greg's or Fiona's?", o: ["who", "which", "whose"], a: 2, e: "Whose + N: Của ai."},
    {q: "This is the laboratory ________ we do all the experiments.", o: ["that", "which", "where"], a: 2, e: "Where: Nơi mà (chỉ địa điểm)."},
    {q: "Novosibirsk, ________ is a big city in Siberia, is famous for its university.", o: ["who", "which", "where"], a: 1, e: "Which thay thế cho tên vật/địa điểm đóng vai trò chủ ngữ trong mệnh đề quan hệ không xác định."},
    {q: "That's the girl ________ father says he's invented a time machine!", o: ["who", "whose", "that"], a: 1, e: "Whose + N: Chỉ sở hữu (bố của cô gái)."},
    {q: "Is this our DVD or is it ________?", o: ["them", "their", "theirs"], a: 2, e: "Theirs = Their DVD (Đại từ sở hữu)."},

    // Transformations
    {q: "Jill described her holiday to me. (told)<br>Jill ________________________ her holiday.", a: ["told me about"], e: "Tell sb about sth = Describe sth to sb."},
    {q: "Companies shouldn't ring people at home to sell them things. (ought)<br>Companies ________________________ ring people at home to sell them things.", a: ["ought not to"], e: "Shouldn't = Ought not to."},
    {q: "I'm almost certain this phone is broken because I can't hear anything. (must)<br>This phone ________________________ because I can't hear anything.", a: ["must be broken"], e: "Must + V: Suy luận logic ở hiện tại (Chắc hẳn là...)."},

    // Modals
    {q: "I couldn't ________ the programme so I turned the TV up.", o: ["hear", "heard", "hearing", "to hear"], a: 0, e: "Couldn't + V-inf."},
    {q: "My brother ________ write when he was just three years old.", o: ["can", "could", "might", "should"], a: 1, e: "Could: Khả năng trong quá khứ."},
    {q: "________ I use your computer to check my e-mail?", o: ["Will", "Ought", "May", "Would"], a: 2, e: "May I: Xin phép lịch sự."},
    {q: "My teacher thinks I ________ to pay more attention in class.", o: ["might", "may", "ought", "should"], a: 2, e: "Chỉ có Ought đi với 'to V'."},
    {q: "All compositions ________ be handed in to me by Friday at the latest.", o: ["must", "need", "have", "ought"], a: 0, e: "Must: Bắt buộc (nội quy/quyết định của người nói)."},
    {q: "That ________ be my mobile - mine is silver and that one is black.", o: ["mustn't", "shouldn't", "wouldn't", "can't"], a: 3, e: "Can't be: Chắc chắn không phải (phủ định của suy luận)."},
    {q: "I sent the letter yesterday, so it ________ get there tomorrow.", o: ["can", "need", "should", "ought"], a: 2, e: "Should: Suy đoán có cơ sở (Đáng lẽ ra sẽ)."},
    {q: "Did you ________ to pay to send the package back?", o: ["must", "ought", "should", "have"], a: 3, e: "Trợ động từ Did đi với 'have to'."},

    // Prepositions, Vocab & Tags
    {q: "Did you write to Irina ________ her visit this summer?", o: ["for", "of", "on", "about"], a: 3, e: "Write about: Viết về cái gì."},
    {q: "You have to ________ on the word 'Next' to see the next web page.", o: ["press", "click", "push", "hit"], a: 1, e: "Click on: Nhấn chuột vào."},
    {q: "I read about the accident ________ the Internet.", o: ["on", "in", "to", "at"], a: 0, e: "On the Internet."},
    {q: "Please don't ________ me when I'm speaking.", o: ["break", "prevent", "pause", "interrupt"], a: 3, e: "Interrupt: Ngắt lời."},
    {q: "When you have written your letter, save the ________ in 'My Documents'.", o: ["paper", "notebook", "file", "line"], a: 2, e: "Save the file: Lưu tệp tin."},
    {q: "I finally managed to ________ Simon to lend me his laptop.", o: ["persuade", "make", "say", "allow"], a: 0, e: "Persuade sb to V: Thuyết phục ai làm gì."},
    {q: "Even when he's very angry, my dad never ________ or uses bad language.", o: ["swears", "tells", "whispers", "broadcasts"], a: 0, e: "Swear: Chửi thề."},
    {q: "I didn't read the message carefully. I just glanced ________ it.", o: ["with", "to", "on", "at"], a: 3, e: "Glance at: Liếc nhìn."},
    {q: "You should ________ me you were going to be late!", o: ["tell", "have told", "to tell", "to have told"], a: 1, e: "Should have PII: Lẽ ra nên làm gì (trách móc trong QK)."},
    {q: "The football match ________ have finished by now. It started over four hours ago!", o: ["must", "ought", "can't", "wouldn't"], a: 0, e: "Must have PII: Suy luận chắc chắn trong quá khứ."},
    {q: "I wonder if you know ________.", o: ["is the post office?", "is the post office.", "the post office is?", "where the post office is."], a: 3, e: "Câu hỏi gián tiếp: Từ để hỏi + S + V (không đảo ngữ)."},
    {q: "You don't eat meat, ________ you?", o: ["are", "eat", "have", "do"], a: 3, e: "Câu hỏi đuôi với động từ thường ở thì HTĐ phủ định -> do you?"},
    {q: "Let's see what's on at the cinema, ________?", o: ["do we", "shall us", "shall we", "let us"], a: 2, e: "Câu hỏi đuôi của Let's là shall we?"},
    {q: "She ________ have bought the tickets today, but I can't be sure.", o: ["must", "might", "can't", "shouldn't"], a: 1, e: "Might have PII: Có thể đã (chưa chắc chắn)."},
    {q: "Could you tell us ________.", o: ["when you were born?", "when you were born.", "when were you born?", "when were you born."], a: 0, e: "Câu hỏi gián tiếp: Từ để hỏi + S + V (when you were born?)."},
    {q: "I'm sleeping in Jim's room tonight, ________ ?", o: ["am not", "don't", "aren't", "isn't"], a: 2, e: "Câu hỏi đuôi của 'I am' là 'aren't I?'."},

    // Advanced Transformations
    {q: "I'm almost certain I didn't leave my wallet in the café. (can't)<br>I ________________________ my wallet in the café.", a: ["can't have left"], e: "Can't have PII: Chắc chắn đã không xảy ra trong QK."},
    {q: "They'll find out that you've lied to them about your age. (away)<br>You won't ________________________ lying to them about your age.", a: ["get away with"], e: "Get away with: Làm sai mà không bị phạt/trót lọt."},
    {q: "Todd lost my favourite CD, but I've forgiven him. (for)<br>I've forgiven ________________________ my favourite CD.", a: ["Todd for losing"], e: "Forgive sb FOR V-ing: Tha thứ cho ai việc gì."},
    {q: "The woman said that my uncle was a thief! (accused)<br>The woman ________________________ a thief!", a: ["accused my uncle of being"], e: "Accuse sb OF V-ing: Buộc tội ai làm gì."},
    {q: "I can't understand why Jake would have said that. (work)<br>I can't ________________________ why Jake would have said that.", a: ["work out"], e: "Work out: Tìm ra lời giải / hiểu ra."},
    {q: "You can always trust Souli. (rely)<br>You can always ________________________ Souli.", a: ["rely on"], e: "Rely on = Trust (Tin tưởng/dựa dẫm vào)."},

    // Advanced Conjunctions & Passives
    {q: "I'll buy a ticket as soon as I ________ my pocket money.", o: ["will get", "would get", "get", "got"], a: 2, e: "Mệnh đề thời gian tương lai dùng thì HTĐ (as soon as I get)."},
    {q: "The food was great, ________ it was very expensive.", o: ["although", "despite", "however", "in spite"], a: 0, e: "Although + S + V: Mặc dù."},
    {q: "I'll get my dad a book for his birthday ________ I find something better.", o: ["if", "until", "although", "unless"], a: 3, e: "Unless = Trừ khi (Tôi sẽ mua sách trừ khi tìm được món khác tốt hơn)."},
    {q: "I'll send you a text message ________ I'm on the bus.", o: ["before", "while", "until", "as soon"], a: 1, e: "While + S + V: Trong khi đang..."},
    {q: "We're going to have ________ down.", o: ["knocked that wall", "that wall knocking", "knocking that wall", "that wall knocked"], a: 3, e: "Have sth PII: Nhờ/thuê người khác làm gì (Have that wall knocked down)."},
    {q: "We decided to go for a walk ________ of the rain.", o: ["although", "despite", "however", "in spite"], a: 3, e: "In spite of + N: Mặc dù."},
    {q: "I ________ the windows cleaned about twice a year.", o: ["get", "put", "am", "do"], a: 0, e: "Get sth PII = Have sth PII (Nhờ/thuê vệ sinh cửa)."},
    {q: "Most students did very well. ________ a few students did very badly.", o: ["Although", "Despite", "However", "In spite of"], a: 2, e: "However đứng đầu câu, ngăn cách bởi dấu phẩy (Tuy nhiên)."}
];

let pool = [];
let currentIndex = 0;
let answered = false;

function init() {
    // Random 40 questions
    const shuffled = allQuestions.sort(() => 0.5 - Math.random());
    pool = shuffled.slice(0, 40);
    renderQuestion();
    
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && answered) {
            nextQuestion();
        } else if (e.key === 'Enter' && !answered) {
            const inputField = document.getElementById('fill-blank');
            if (inputField && document.activeElement === inputField) {
                checkAnswer(inputField.value.trim());
            }
        }
    });
}

function renderQuestion() {
    if(currentIndex >= pool.length) {
        document.getElementById('app').innerHTML = `<h2 style="color:var(--primary);">🎉 Hoàn thành bài tập!</h2><p>Bạn đã trả lời xong 40 câu hỏi.</p><button class="btn" onclick="location.reload()">Làm lại</button>`;
        return;
    }
    
    answered = false;
    const currentQuestion = pool[currentIndex];
    
    document.getElementById('progress').innerText = `Câu hỏi ${currentIndex + 1} / 40`;
    document.getElementById('explanation').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    
    const container = document.getElementById('question-container');
    container.innerHTML = `<div class="question-text">${currentQuestion.q}</div>`;
    
    if(currentQuestion.o) {
        // MCQ
        const optsDiv = document.createElement('div');
        optsDiv.className = 'options';
        currentQuestion.o.forEach((optText, idx) => {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.id = 'lbl-' + idx;
            label.innerHTML = `<input type="radio" name="answer" value="${idx}"> ${optText}`;
            label.onclick = () => { if(!answered) checkAnswer(idx); };
            optsDiv.appendChild(label);
        });
        container.appendChild(optsDiv);
    } else {
        // Fill in the blank
        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'fill-blank';
        input.placeholder = 'Nhập câu trả lời của bạn...';
        input.autocomplete = 'off';
        
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = 'Kiểm tra';
        btn.onclick = () => { if(!answered) checkAnswer(input.value.trim()); };
        
        container.appendChild(input);
        container.appendChild(btn);
        
        // Auto focus
        setTimeout(() => input.focus(), 100);
    }
}

function checkAnswer(userAns) {
    if(answered) return;
    const currentQuestion = pool[currentIndex];
    
    // For text input, block empty
    if (!currentQuestion.o && userAns === "") return;
    
    answered = true;
    let isCorrect = false;
    let correctText = "";
    
    if(currentQuestion.o) {
        isCorrect = (userAns === currentQuestion.a);
        correctText = currentQuestion.o[currentQuestion.a];
    } else {
        const userStr = String(userAns).toLowerCase().trim();
        if (Array.isArray(currentQuestion.a)) {
            isCorrect = currentQuestion.a.some(valid => valid.toLowerCase() === userStr);
            correctText = currentQuestion.a.join(" hoặc ");
        } else {
            isCorrect = (userStr === currentQuestion.a.toLowerCase());
            correctText = currentQuestion.a;
        }
    }
    
    // Show Explanation
    const expDiv = document.getElementById('explanation');
    expDiv.style.display = 'block';
    expDiv.className = isCorrect ? 'exp-correct' : 'exp-wrong';
    
    expDiv.innerHTML = `<strong>${isCorrect ? '✅ Chính xác!' : '❌ Sai rồi!'}</strong><br>
    ${!isCorrect ? `<strong>Đáp án đúng:</strong> ${correctText}<br>` : ''}
    <div style="margin-top:8px;"><strong>Giải thích:</strong> ${currentQuestion.e}</div>`;
    
    // UI Updates
    if(currentQuestion.o) {
        document.getElementById('lbl-' + currentQuestion.a).classList.add('correct-element');
        if(!isCorrect) {
            document.getElementById('lbl-' + userAns).classList.add('wrong-element');
        }
        // Disable all radios
        document.querySelectorAll('input[type="radio"]').forEach(el => el.disabled = true);
    } else {
        const inp = document.getElementById('fill-blank');
        inp.classList.add(isCorrect ? 'correct-element' : 'wrong-element');
        inp.disabled = true;
    }
    
    const nextBtn = document.getElementById('next-btn');
    nextBtn.style.display = 'block';
    nextBtn.onclick = nextQuestion;
}

function nextQuestion() {
    currentIndex++;
    renderQuestion();
}

// Start
window.onload = init;
</script>
