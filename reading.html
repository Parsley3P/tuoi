<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL Reading Practice</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --correct-bg: #dcfce7;
            --correct-border: #22c55e;
            --wrong-bg: #fee2e2;
            --wrong-border: #ef4444;
            --text: #1f2937;
            --bg: #f3f4f6;
            --frame-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .frame {
            background-color: var(--frame-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            text-align: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .passage-text {
            white-space: pre-wrap;
            margin-bottom: 30px;
        }

        /* Cloze Inputs */
        input.cloze-input {
            width: 100px;
            padding: 4px 8px;
            margin: 0 4px;
            border: 2px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        input.cloze-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .cloze-feedback {
            display: none;
            font-size: 0.9rem;
            margin-top: 5px;
            padding: 8px 12px;
            border-radius: 6px;
        }

        /* MCQ Blocks */
        .mcq-block {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .mcq-title {
            font-weight: 600;
            margin-bottom: 10px;
        }
        .mcq-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 600px) {
            .mcq-options { grid-template-columns: 1fr; }
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-label:hover {
            background: #f3f4f6;
        }
        .option-label input {
            margin-right: 10px;
            transform: scale(1.2);
        }

        /* Status Classes */
        .is-correct-input {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #166534;
        }
        .is-wrong-input {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: #991b1b;
            text-decoration: line-through;
        }
        .is-correct-box {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
        }
        .is-wrong-box {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
        }
        
        .explanation {
            display: none;
            margin-top: 10px;
            font-size: 0.95rem;
            color: #374151;
            padding: 10px;
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            border-radius: 4px;
        }

        /* Buttons */
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Cho phép rớt dòng trên điện thoại nếu chật */
            gap: 15px;
            margin-bottom: 40px;
        }
        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; box-shadow: none; }
        
        #btn-next { display: none; background-color: #059669; }
        #btn-next:hover { background-color: #047857; }
        
        #btn-retry { display: none; background-color: #f59e0b; }
        #btn-retry:hover { background-color: #d97706; }

        .progress {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            color: #6b7280;
        }
    </style>
</head>

                for (let key in passage.mcqs) {
                    const qData = passage.mcqs[key];
                    const selected = document.querySelector(`input[name="q_${key}"]:checked`);
                    const correctAnsIndex = qData.ans;
                    
                    const correctLabel = document.getElementById(`label-${key}-${correctAnsIndex}`);
                    correctLabel.classList.add('is-correct-box');

                    if (selected) {
                        const val = parseInt(selected.value);
                        if (val !== correctAnsIndex) {
                            const wrongLabel = document.getElementById(`label-${key}-${val}`);
                            wrongLabel.classList.add('is-wrong-box');
                        }
                    }

                    const radios = document.querySelectorAll(`input[name="q_${key}"]`);
                    radios.forEach(r => r.disabled = true);

                    document.getElementById(`exp-${key}`).style.display = 'block';
                }
            }

            isChecked = true;
            
            // Ẩn nút Check, hiện nút Retry và Next
            btnCheck.style.display = 'none';
            btnRetry.style.display = 'inline-block';
            btnNext.style.display = 'inline-block';
            
            if (currentIndex >= rawData.length - 1) {
                btnNext.innerText = "Hoàn thành!";
                btnNext.disabled = true;
            } else {
                btnNext.innerText = "Bài tiếp (Next) ⏎";
                btnNext.disabled = false;
            }
        }

        // Event Listeners
        btnCheck.addEventListener('click', checkAnswers);
        
        btnRetry.addEventListener('click', () => {
            // Render lại đúng bài hiện tại để người dùng có thể làm lại
            renderPassage(currentIndex);
        });

        btnNext.addEventListener('click', () => {
            if (currentIndex < rawData.length - 1) {
                currentIndex++;
                renderPassage(currentIndex);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (!isChecked) {
                    checkAnswers();
                } else if (currentIndex < rawData.length - 1) {
                    currentIndex++;
                    renderPassage(currentIndex);
                }
            }
        });

        // Initialize App
        renderPassage(0);
    </script>
</body>
</html>
